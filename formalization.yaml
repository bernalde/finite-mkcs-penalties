version: v0.4
project:
  name: Finite MkCS exact penalties, universal thresholds and sequential repair
  description: A finite-graph formalization of nonlinear and linear QUBO penalties for the maximum k-colorable
    vertex-subset problem. It retains the earlier nonlinear interface and adds jointly optimized binary
    slack arrays, exact sequential feasibility repair, strict versus weak penalty guarantees, one-color
    exceptions and universal value thresholds. An unchanged companion follows the manuscript’s strict
    nonlinear single-slot-deletion proof.
  authors:
  - David E. Bernal Neira
  responsible_maintainers:
  - David E. Bernal Neira
  license: Apache-2.0
