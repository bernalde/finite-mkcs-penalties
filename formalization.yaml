version: v0.4
project:
  name: Finite nonlinear MkCS exact penalty thresholds
  description: 'An adapted finite nonlinear QUBO formalization for the maximum k-colorable vertex-subset
    problem: binary-domain attainment, ordered color-pair normalization, weak optimal-value equality
    with auxiliary repair, strict optimizer feasibility, the one-color exception and attained boundary
    ties.'
  authors:
  - David E. Bernal Neira
  license: Apache-2.0
  responsible_maintainers:
  - David E. Bernal Neira
classification:
  arxiv:
  - math.OC
  - math.CO
  msc2020:
  - 90C27
  - 90C20
sources:
- title: Characterization of QUBO reformulations for the maximum k-colorable subgraph problem
  authors:
  - Rodolfo Quintero
  - David Bernal
  - Tamás Terlaky
  - Luis F. Zuluaga
  id: doi:10.1007/s11128-022-03421-z
  type: paper
  location: https://link.springer.com/article/10.1007/s11128-022-03421-z
  relationship: adapts
  note: Published in 2022. The pilot uses the corrected finite nonlinear vertex/color-slot model
    with an explicit ordered color sum. It separates weak value/repair guarantees from strict optimizer
    feasibility; it does not claim a verbatim formalization of every source statement or source
    author endorsement. No source article or publisher PDF is redistributed.
status:
  scope: One nonlinear finite-graph family only. Weak bounds are c1 >= 1 and 2*c2 >= 1; strict bounds
    are c1 > 1 and 2*c2 > 1. At k = 1, c2 is any real. Full binary maxima include the quantified
    degenerate n/k domains. Two boundary controls are actual infeasible global maxima. The repair
    is auxiliary simultaneous deletion, not sequential Algorithm12. Universal necessity/iff results,
    the linear slack formulation, quantum/embedding, solver performance, and runtime claims are
    not included.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
  main_results:
  - declaration: PalomarMkCS.solution
    file: Solution.lean
    sorry_count: 0
    axioms:
