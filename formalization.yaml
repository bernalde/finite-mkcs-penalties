status:
  scope: Finite maximum k-colorable vertex-subset QUBO models with explicit binary domains. The original
    nonlinear ten-component interface is unchanged. The extension adds full jointly optimized binary x,s,t
    linear maxima, strict linear feasibility, weak value/actual sequential repair, one-color branches
    and corrected universal value thresholds over all finite graphs. Algorithm12 is an actual two-pass
    current-state scan with a sound/exhaustive edge list and exhaustive slot list; arbitrary order and
    repetitions are retained. The nonlinear color product is ordered, so its effective unordered coefficient
    is2*c2. The same strict nonlinear theorem also has the accepted manuscript-route single-slot-deletion
    proof. The printed local linear slack-update map remains defective; the linear proof uses canonical
    lifts and explicitly does not claim to verify that map. No quantum/software/runtime or empirical conclusion
    is included.
  package_verification: PASS_BUILD_AXIOMS_SANDBOXED_COMPARATOR_LEAN_NANODA_CONRON in the retained mkcs02
    receipt; both full compared roots use only Classical.choice, Quot.sound and propext, with no sorryAx
    or unproved research-specific axiom. Independent bounded package/interface review was SATISFACTORY.
    MKCS-DOC-01 is independently closed; retained pinned metadata/schema checks passed. Exact source export and rights/privacy validation are separately recorded.
    All Lean sources, toolchain/dependency pins, Lake files and comparator.json retain their checked
    hashes; see VERIFICATION.json. No version 2 public/hosted/service/registration result is claimed.
  main_results:
  - declaration: PalomarMkCS.solution
    file: Solution.lean
    comparator_config: comparator.json
    note: Original nonlinear ten-component bundle; not ten new research contributions.
  - declaration: PalomarMkCS.extension_solution
    file: Solution.lean
    comparator_config: comparator.json
    note: Fourteen explicit extension components in one coherent family; includes a same-theorem proof-route
      comparison, not a new theorem credit.
